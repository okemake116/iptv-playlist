name: Update playlist

on:
  schedule:
    - cron: '0 2 * * *'   # every day at 05:00 Moscow time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build playlist
        run: python3 build_playlist.py free-channels.m3u
      - name: Commit if changed
        run: |
          if git diff --quiet -- free-channels.m3u; then echo "no changes"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add free-channels.m3u
          git commit -m "Update playlist $(date -u +%F)"
          git push
