name: Update playlist

on:
  schedule:
    - cron: '0 2 * * *'   # every day at 05:00 Moscow time
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: 'Commit even if the playlist loses more than 30% of its channels'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Fails (and nothing is committed) if the playlist would shrink by more than 30%.
      - name: Build playlist
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: |
          if [ "$ALLOW_SHRINK" = "true" ]; then
            python3 build_playlist.py free-channels.m3u --max-shrink 1
          else
            python3 build_playlist.py free-channels.m3u
          fi
      - name: Commit if changed
        run: |
          git add free-channels.m3u state/fails.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update playlist $(date -u +%F)"
          git push
